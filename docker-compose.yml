version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexsra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexsra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexsra_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexsra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexsra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexsra_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexsra_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexsra}:${POSTGRES_PASSWORD:-nexsra_password}@postgres:5432/${POSTGRES_DB:-nexsra}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexsra_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_uploads:
